services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: casefile
      POSTGRES_PASSWORD: casefile
      POSTGRES_DB: casefile
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casefile -d casefile"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata: