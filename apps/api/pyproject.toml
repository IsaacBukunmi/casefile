[project]
name = "casefile-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "IsaacBukunmi", email = "adetonaisaac12345@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.161.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
]

[project.scripts]
casefile-api = "casefile_api:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.uv]
package = false   # this is an app we run, not a library we install

[tool.ruff.lint.per-file-ignores]
"app/seed.py" = ["E501"]   # seed data is a table; long rows read better than wrapped ones
