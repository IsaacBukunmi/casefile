[project]
name = "casefile-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "IsaacBukunmi", email = "adetonaisaac12345@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "fastapi[standard]>=0.161.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.uv]
package = false   # this is an app we run, not a library we install

[tool.ruff.lint.per-file-ignores]
"app/seed.py" = ["E501"]   # seed data is a table; long rows read better than wrapped ones
"tests/conftest.py" = ["E402"]  # the test database URL must be set before app imports


[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]

# Run Ruff on every new migration, so generated files pass lint without manual fixes.
[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"
